<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - E-Register Ec2(1)</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold text-slate-900">Employee Management System</a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="/" class="text-slate-600 hover:text-indigo-600">Home</a>
        <a href="/register" class="text-slate-600 hover:text-indigo-600">Register</a>
      </div>
    </div>
  </nav>

  <main class="max-w-md mx-auto px-6 py-20">
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Welcome Back</h1>
      <p class="text-slate-500 text-sm mb-8">Log in to access your employee profile.</p>

      <div id="formMessage" class="hidden mb-6 rounded-lg px-4 py-3 text-sm"></div>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition">
          Login
        </button>
      </form>

      <p class="text-sm text-slate-500 mt-6 text-center">
        Don't have an account? <a href="/register" class="text-indigo-600 font-medium hover:underline">Register</a>
      </p>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
