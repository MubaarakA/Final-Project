<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - E-Register Ec2(1)</title>
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold text-slate-900">Employee Management System</a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="/" class="text-slate-600 hover:text-indigo-600">Home</a>
        <a href="/login" class="text-slate-600 hover:text-indigo-600">Login</a>
      </div>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-6 py-14">
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Create Your Account</h1>
      <p class="text-slate-500 text-sm mb-8">Fill in your details to register as an employee.</p>

      <div id="formMessage" class="hidden mb-6 rounded-lg px-4 py-3 text-sm"></div>

      <form id="registerForm" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
          <input type="text" name="fullName" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
          <input type="tel" name="phone" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Employee ID</label>
          <input type="text" name="employeeId" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Department</label>
          <input type="text" name="department" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Position</label>
          <input type="text" name="position" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
          <input type="password" name="confirmPassword" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Profile Picture</label>
          <input type="file" name="profilePicture" accept="image/jpeg,image/png,image/webp" class="w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
          <p class="error-text hidden text-red-600 text-xs mt-1"></p>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition">
          Create Account
        </button>
      </form>
    </div>
  </main>

  <script src="/js/register.js"></script>
</body>
</html>
