name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Skips checkout's post-job credential cleanup (which runs a
          # `git submodule foreach` even with no submodules) — that step is
          # known to hang on some self-hosted runners. We don't need git to
          # keep credentials past this job anyway.
          persist-credentials: false

      - name: Sync checkout into deployment directory
        # actions/checkout clones into the runner's own workspace, not
        # /home/ubuntu/Final-Project, so copy the fresh code there first.
        run: |
          mkdir -p /home/ubuntu/Final-Project
          rsync -a --delete --exclude node_modules --exclude .env "$GITHUB_WORKSPACE"/ /home/ubuntu/Final-Project/

      - name: Install dependencies
        run: npm install
        working-directory: /home/ubuntu/Final-Project

      - name: Run tests
        run: npm test
        working-directory: /home/ubuntu/Final-Project

      - name: Restart application with PM2
        if: success()
        run: pm2 restart employee-system || pm2 start backend/server.js --name "employee-system"
        working-directory: /home/ubuntu/Final-Project
