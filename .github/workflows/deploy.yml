name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync checkout into deployment directory
        # actions/checkout clones into the runner's own workspace, not
        # /home/ubuntu/Final-Project, so copy the fresh code there first.
        run: |
          mkdir -p /home/ubuntu/Final-Project
          rsync -a --delete --exclude node_modules --exclude .env "$GITHUB_WORKSPACE"/ /home/ubuntu/Final-Project/

      - name: Install dependencies
        run: npm install
        working-directory: /home/ubuntu/Final-Project

      - name: Run tests
        run: npm test
        working-directory: /home/ubuntu/Final-Project

      - name: Restart application with PM2
        if: success()
        run: pm2 restart employee-system
        working-directory: /home/ubuntu/Final-Project
